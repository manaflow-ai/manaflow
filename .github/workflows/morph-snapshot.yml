name: Daily Morph Snapshot

on:
  schedule:
    - cron: "0 18 * * *" # 10am PST / 11am PDT
  workflow_dispatch:

concurrency:
  group: morph-snapshot
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  BUN_VERSION: "1.2.21"
  GO_VERSION: "1.23"

jobs:
  morph-snapshot:
    name: Build Morph Snapshot
    # This job has write permissions and a Morph API credential. Always run
    # the checked-in main revision, including for a manual dispatch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write # Push the generated snapshot branch.
      pull-requests: write # Open the generated snapshot pull request.
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.5.0

      - name: Cache Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run morph snapshot (with retry)
        env:
          MORPH_API_KEY: ${{ secrets.MORPH_API_KEY }}
        run: |
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts"
            if uv run ./scripts/snapshot.py; then
              echo "Snapshot completed successfully"
              exit 0
            fi
            echo "Attempt $attempt failed"
            if [ $attempt -lt $max_attempts ]; then
              echo "Waiting 30 seconds before retry..."
              sleep 30
            fi
            attempt=$((attempt + 1))
          done
          echo "All $max_attempts attempts failed"
          exit 1

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git user
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create branch and commit
        if: steps.changes.outputs.has_changes == 'true'
        id: commit
        env:
          # Supply GitHub authentication through process environment config,
          # not a command-line argument that other local processes can read.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: "AUTHORIZATION: bearer ${{ github.token }}"
        run: |
          BRANCH_NAME="morph-snapshot-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          git add configs/ide-deps.json packages/shared/src/morph-snapshots.json
          git commit -m "chore: daily morph snapshot update"
          git push -u origin "$BRANCH_NAME"
          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          gh pr create \
            --title "chore: daily morph snapshot update" \
            --body "Automated daily morph snapshot update.

          ## Changes
          - Updated morph snapshots to latest version
          - Updated IDE extension and CLI package versions

          ## Test plan
          - [ ] Verify new snapshots work by starting a sandbox session" \
            --head "$SNAPSHOT_BRANCH" \
            --base main
