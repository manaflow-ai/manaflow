name: cmux-proxy (Rust)

on:
  push:
    branches: [main]
    paths:
      - crates/cmux-proxy/**
      - .github/workflows/cmux-proxy.yml
  pull_request:
    paths:
      - crates/cmux-proxy/**
      - .github/workflows/cmux-proxy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.8
        with:
          workspaces: crates/cmux-proxy

      - name: Format
        run: cargo fmt --all -- --check
        working-directory: crates/cmux-proxy

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: crates/cmux-proxy

      - name: Tests
        run: cargo test --all-features --locked
        working-directory: crates/cmux-proxy
