name: Sandbox (Rust)

on:
  push:
    branches: [main]
    paths:
      - packages/sandbox/**
      - .github/workflows/sandbox.yml
  pull_request:
    paths:
      - packages/sandbox/**
      - .github/workflows/sandbox.yml

concurrency:
  group: sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-sandbox

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.8
        with:
          workspaces: packages/sandbox

      - name: Format
        run: cargo fmt --all -- --check
        working-directory: packages/sandbox

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: packages/sandbox

      - name: Tests
        run: cargo test --all-features --locked
        working-directory: packages/sandbox

  docker-build:
    name: Build Docker image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: rust-checks
    if: github.ref == 'refs/heads/main' && github.ref_protected == true
    permissions:
      contents: read
      packages: write # Publish the image to GHCR from protected main only.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted publication ref
        env:
          TRUSTED_BASE_SHA: ${{ github.sha }}
          TRUSTED_REF_KIND: main
          TRUSTED_SOURCE_SHA: ${{ github.sha }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TRUSTED_WORKFLOW_PATH: .github/workflows/sandbox.yml
        shell: bash
        run: .github/scripts/verify-privileged-ref.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: packages/sandbox/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test

      - name: Test coding agent CLIs
        env:
          TEST_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test
        run: |
          docker run --rm --entrypoint /bin/bash "$TEST_IMAGE" -c '
            pids=()
            claude --version & pids+=($!)
            codex --version & pids+=($!)
            gemini --version & pids+=($!)
            opencode --version & pids+=($!)
            amp --version & pids+=($!)
            for pid in "${pids[@]}"; do wait $pid || exit 1; done
          '

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: packages/sandbox/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          digest="$BUILD_DIGEST"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Create multi-arch manifest
    runs-on: ubuntu-24.04
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.ref_protected == true
    permissions:
      contents: read
      packages: write # Publish the manifest to GHCR from protected main only.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted publication ref
        env:
          TRUSTED_BASE_SHA: ${{ github.sha }}
          TRUSTED_REF_KIND: main
          TRUSTED_SOURCE_SHA: ${{ github.sha }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TRUSTED_WORKFLOW_PATH: .github/workflows/sandbox.yml
        shell: bash
        run: .github/scripts/verify-privileged-ref.sh

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          shopt -s nullglob
          digest_files=(*)
          if (( ${#digest_files[@]} == 0 )); then
            echo "No image digests were uploaded" >&2
            exit 1
          fi

          metadata_args=()
          while IFS= read -r tag; do
            metadata_args+=("-t" "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          digest_args=()
          for digest_file in "${digest_files[@]}"; do
            digest_args+=("${REGISTRY}/${IMAGE_NAME}@sha256:${digest_file}")
          done

          docker buildx imagetools create "${metadata_args[@]}" "${digest_args[@]}"

      - name: Inspect image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE_REF"
