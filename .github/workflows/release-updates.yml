  mac-arm64:
    name: macOS arm64
    needs: prepare-release
    if: >-
      github.ref_protected == true &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'manaflow-ai/manaflow/.github/workflows/release-pr.yml@refs/heads/main' &&
      startsWith(inputs.release_ref, 'release/v') &&
      inputs.release_sha != '' &&
      inputs.release_base_sha != '' &&
      inputs.caller_sha == github.sha
    environment: electron
    permissions:
      # Required to upload signed artifacts to the GitHub release.
      contents: write # Upload signed macOS arm64 artifacts to the verified release.
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted release ref
        env:
          TRUSTED_BASE_SHA: ${{ inputs.release_base_sha }}
          TRUSTED_CALLED_WORKFLOW_PATH: .github/workflows/release-updates.yml
          TRUSTED_CALLER_REF: ${{ github.ref }}
          TRUSTED_EVENT_REF: ${{ format('refs/heads/{0}', inputs.release_ref) }}
          TRUSTED_EVENT_REF_TYPE: branch
          TRUSTED_EVENT_SHA: ${{ inputs.release_sha }}
          TRUSTED_REF_KIND: release-branch
          TRUSTED_REF_PROTECTED: ${{ github.ref_protected }}
          TRUSTED_SOURCE_SHA: ${{ inputs.release_sha }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.caller_sha }}
          TRUSTED_WORKFLOW_PATH: .github/workflows/release-pr.yml
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRUSTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ && \
            "$TRUSTED_WORKFLOW_SHA" == "$GITHUB_SHA" ]] || {
            echo "Caller SHA does not match the protected workflow SHA" >&2
            exit 1
          }
          if ! git cat-file -e "$TRUSTED_WORKFLOW_SHA^{commit}" 2>/dev/null; then
            GIT_TERMINAL_PROMPT=0 git fetch --no-tags origin "$TRUSTED_WORKFLOW_SHA" >/dev/null 2>&1 || {
              echo "Unable to fetch the protected caller commit" >&2
              exit 1
            }
          fi
          trusted_gate="${RUNNER_TEMP:?}/verify-privileged-ref-${GITHUB_JOB}.sh"
          git show "$TRUSTED_WORKFLOW_SHA:.github/scripts/verify-privileged-ref.sh" > "$trusted_gate"
          chmod 700 "$trusted_gate"
          "$trusted_gate"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Configure Cargo home
        run: |
          set -euo pipefail
          temp_dir="${RUNNER_TEMP:-}"
          if [[ -z "$temp_dir" ]]; then
            temp_dir="$(mktemp -d)"
          fi
          cargo_home="$temp_dir/cargo-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          cargo_target_dir="$temp_dir/cargo-target-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          mkdir -p "$cargo_home/bin"
          mkdir -p "$cargo_target_dir"
          {
            echo "CARGO_HOME=$cargo_home"
            echo "CARGO_TARGET_DIR=$cargo_target_dir"
            echo "RUSTUP_HOME=$cargo_home"
            echo "PATH=$cargo_home/bin:$PATH"
          } >> "$GITHUB_ENV"
      - name: Configure Bun install dir
        run: |
          set -euo pipefail
          temp_dir="${RUNNER_TEMP:-}"
          if [[ -z "$temp_dir" ]]; then
            temp_dir="$(mktemp -d)"
          fi
          bun_install="$temp_dir/bun-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          mkdir -p "$bun_install"
          echo "BUN_INSTALL=$bun_install" >> "$GITHUB_ENV"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21
          no-cache: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile
      - name: Install app deps in apps/client (bun)
        working-directory: apps/client
        run: bun install --frozen-lockfile
      - name: Write .env for build
        shell: bash
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_STACK_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_STACK_PROJECT_ID }}
          NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY }}
          NEXT_PUBLIC_WWW_ORIGIN: ${{ secrets.NEXT_PUBLIC_WWW_ORIGIN }}
          NEXT_PUBLIC_GITHUB_APP_SLUG: ${{ secrets.NEXT_PUBLIC_GITHUB_APP_SLUG }}
        run: |
          set -euo pipefail
          {
            printf 'NEXT_PUBLIC_CONVEX_URL=%s\n' "$NEXT_PUBLIC_CONVEX_URL"
            printf 'NEXT_PUBLIC_STACK_PROJECT_ID=%s\n' "$NEXT_PUBLIC_STACK_PROJECT_ID"
            printf 'NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY=%s\n' "$NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY"
            printf 'NEXT_PUBLIC_WWW_ORIGIN=%s\n' "$NEXT_PUBLIC_WWW_ORIGIN"
            printf 'NEXT_PUBLIC_GITHUB_APP_SLUG=%s\n' "$NEXT_PUBLIC_GITHUB_APP_SLUG"
          } > .env
      - name: Build native Rust addon
        working-directory: apps/server/native/core
        shell: bash
        env:
          # Limit parallel rustc jobs to reduce peak memory usage on self-hosted runners
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Building native addon (attempt $attempt/3)..."
            if bunx --bun @napi-rs/cli build --platform --release; then
              echo "Build succeeded"
              break
            fi
            if [[ $attempt -eq 3 ]]; then
              echo "Build failed after 3 attempts" >&2
              exit 1
            fi
            echo "Build failed, retrying in 10 seconds..."
            sleep 10
          done
      - name: Build, sign, and notarize (arm64) via publish script
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/publish-build-mac-arm64.sh --skip-install
      - name: Publish notarized macOS arm64 artifacts to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          REPO: ${{ github.repository }}
        working-directory: apps/client
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/latest-*.yml
            dist-electron/*.blockmap
          )
          if [[ ${#artifacts[@]} -eq 0 ]]; then
            echo "No notarized macOS arm64 artifacts found in dist-electron" >&2
            exit 1
          fi
          release_tag="${RELEASE_TAG:-}"
          if [[ -z "$release_tag" ]]; then
            echo "Release tag not provided" >&2
            exit 1
          fi
          repo="${REPO}"
          for artifact in "${artifacts[@]}"; do
            echo "Uploading $artifact to $repo@$release_tag"
            gh release upload "$release_tag" "$artifact" --repo "$repo" --clobber
          done

  mac-universal:
    name: macOS universal
    needs: prepare-release
    if: >-
      github.ref_protected == true &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'manaflow-ai/manaflow/.github/workflows/release-pr.yml@refs/heads/main' &&
      startsWith(inputs.release_ref, 'release/v') &&
      inputs.release_sha != '' &&
      inputs.release_base_sha != '' &&
      inputs.caller_sha == github.sha
    environment: electron
    permissions:
      # Required to upload signed artifacts to the GitHub release.
      contents: write # Upload signed macOS universal artifacts to the verified release.
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted release ref
        env:
          TRUSTED_BASE_SHA: ${{ inputs.release_base_sha }}
          TRUSTED_CALLED_WORKFLOW_PATH: .github/workflows/release-updates.yml
          TRUSTED_CALLER_REF: ${{ github.ref }}
          TRUSTED_EVENT_REF: ${{ format('refs/heads/{0}', inputs.release_ref) }}
          TRUSTED_EVENT_REF_TYPE: branch
          TRUSTED_EVENT_SHA: ${{ inputs.release_sha }}
          TRUSTED_REF_KIND: release-branch
          TRUSTED_REF_PROTECTED: ${{ github.ref_protected }}
          TRUSTED_SOURCE_SHA: ${{ inputs.release_sha }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.caller_sha }}
          TRUSTED_WORKFLOW_PATH: .github/workflows/release-pr.yml
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRUSTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ && \
            "$TRUSTED_WORKFLOW_SHA" == "$GITHUB_SHA" ]] || {
            echo "Caller SHA does not match the protected workflow SHA" >&2
            exit 1
          }
          if ! git cat-file -e "$TRUSTED_WORKFLOW_SHA^{commit}" 2>/dev/null; then
            GIT_TERMINAL_PROMPT=0 git fetch --no-tags origin "$TRUSTED_WORKFLOW_SHA" >/dev/null 2>&1 || {
              echo "Unable to fetch the protected caller commit" >&2
              exit 1
            }
          fi
          trusted_gate="${RUNNER_TEMP:?}/verify-privileged-ref-${GITHUB_JOB}.sh"
          git show "$TRUSTED_WORKFLOW_SHA:.github/scripts/verify-privileged-ref.sh" > "$trusted_gate"
          chmod 700 "$trusted_gate"
          "$trusted_gate"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure Cargo home
        run: |
          set -euo pipefail
          temp_dir="${RUNNER_TEMP:-}"
          if [[ -z "$temp_dir" ]]; then
            temp_dir="$(mktemp -d)"
          fi
          cargo_home="$temp_dir/cargo-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          cargo_target_dir="$temp_dir/cargo-target-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          mkdir -p "$cargo_home/bin"
          mkdir -p "$cargo_target_dir"
          {
            echo "CARGO_HOME=$cargo_home"
            echo "CARGO_TARGET_DIR=$cargo_target_dir"
            echo "RUSTUP_HOME=$cargo_home"
            echo "PATH=$cargo_home/bin:$PATH"
          } >> "$GITHUB_ENV"

      - name: Configure Bun install dir
        run: |
          set -euo pipefail
          temp_dir="${RUNNER_TEMP:-}"
          if [[ -z "$temp_dir" ]]; then
            temp_dir="$(mktemp -d)"
          fi
          bun_install="$temp_dir/bun-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          mkdir -p "$bun_install"
          echo "BUN_INSTALL=$bun_install" >> "$GITHUB_ENV"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21
          no-cache: true

      # x86_64 toolchain for node-gyp and friends
      - name: Ensure Rosetta (for x64 toolchain)
        shell: bash
        run: |
          set -euo pipefail
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true

      - name: Install Rust toolchain and mac targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Generate icons (apps/client)
        working-directory: apps/client
        run: bun run ./scripts/generate-icons.mjs

      - name: Prepare macOS entitlements
        run: bash scripts/publish-prepare-macos-entitlements.sh

      - name: Write .env for build
        shell: bash
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_STACK_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_STACK_PROJECT_ID }}
          NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY }}
          NEXT_PUBLIC_WWW_ORIGIN: ${{ secrets.NEXT_PUBLIC_WWW_ORIGIN }}
          NEXT_PUBLIC_GITHUB_APP_SLUG: ${{ secrets.NEXT_PUBLIC_GITHUB_APP_SLUG }}
        run: |
          set -euo pipefail
          {
            printf 'NEXT_PUBLIC_CONVEX_URL=%s\n' "$NEXT_PUBLIC_CONVEX_URL"
            printf 'NEXT_PUBLIC_STACK_PROJECT_ID=%s\n' "$NEXT_PUBLIC_STACK_PROJECT_ID"
            printf 'NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY=%s\n' "$NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY"
            printf 'NEXT_PUBLIC_WWW_ORIGIN=%s\n' "$NEXT_PUBLIC_WWW_ORIGIN"
            printf 'NEXT_PUBLIC_GITHUB_APP_SLUG=%s\n' "$NEXT_PUBLIC_GITHUB_APP_SLUG"
          } > .env

      - name: Remove stale macOS native binaries
        working-directory: apps/server/native/core
        shell: bash
        run: |
          set -euo pipefail
          rm -f cmux_native_core.darwin-*.node

      # Prebuild the Rust N-API addon for both slices so electron-builder can pick them up.
      # Build sequentially with limited parallelism to avoid OOM on self-hosted runners.
      - name: Build native Rust addon (arm64 + x64)
        working-directory: apps/server/native/core
        shell: bash
        env:
          # Limit parallel rustc jobs to reduce peak memory usage
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin aarch64-apple-darwin || true

          # Build x86_64 first with retry logic for transient OOM failures
          for attempt in 1 2 3; do
            echo "Building x86_64-apple-darwin (attempt $attempt/3)..."
            if bunx --bun @napi-rs/cli build --platform --release --target x86_64-apple-darwin; then
              echo "x86_64-apple-darwin build succeeded"
              break
            fi
            if [[ $attempt -eq 3 ]]; then
              echo "x86_64-apple-darwin build failed after 3 attempts" >&2
              exit 1
            fi
            echo "Build failed, retrying in 10 seconds..."
            sleep 10
          done

          # Build aarch64 with retry logic
          for attempt in 1 2 3; do
            echo "Building aarch64-apple-darwin (attempt $attempt/3)..."
            if bunx --bun @napi-rs/cli build --platform --release --target aarch64-apple-darwin; then
              echo "aarch64-apple-darwin build succeeded"
              break
            fi
            if [[ $attempt -eq 3 ]]; then
              echo "aarch64-apple-darwin build failed after 3 attempts" >&2
              exit 1
            fi
            echo "Build failed, retrying in 10 seconds..."
            sleep 10
          done

      - name: Verify macOS native addon slices
        working-directory: apps/server/native/core
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f cmux_native_core.darwin-arm64.node ]]; then
            echo "arm64 native binary missing" >&2
            exit 1
          fi
          if compgen -G 'cmux_native_core.darwin-x64.node' >/dev/null; then
            ls -l cmux_native_core.darwin-x64.node
          elif compgen -G 'cmux_native_core.darwin-x86_64.node' >/dev/null; then
            mv cmux_native_core.darwin-x86_64.node cmux_native_core.darwin-x64.node
            ls -l cmux_native_core.darwin-x64.node
          else
            echo "x64 native binary missing" >&2
            exit 1
          fi

      - name: Prepare signing credentials
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          tmpdir_cert="$(mktemp -d)"
          cert_path="$tmpdir_cert/mac_signing_cert.p12"
          node -e "process.stdout.write(Buffer.from(process.env.MAC_CERT_BASE64,'base64'))" > "$cert_path"
          echo "CSC_LINK=$cert_path" >> "$GITHUB_ENV"
          if [[ -n "${APPLE_API_KEY:-}" && ! -f "${APPLE_API_KEY}" ]]; then
            tmpdir_key="$(mktemp -d)"
            key_path="$tmpdir_key/AuthKey_${APPLE_API_KEY_ID:-api}.p8"
            KEY_PATH="$key_path" node -e "const fs=require('fs');let raw=process.env.APPLE_API_KEY||'';if(!raw){process.stderr.write('APPLE_API_KEY is empty\n');process.exit(1)};const unesc=s=>s.includes('\\n')&&!s.includes('\n')?s.replace(/\\\\n/g,'\n'):s;const tryB64=s=>{try{const b=s.replace(/\\s+/g,'');const d=Buffer.from(b,'base64').toString('utf8');if(d.includes('-----BEGIN'))return d;}catch{};return null;};let lit=unesc(raw).replace(/\\r\\n?/g,'\n');let out=lit.includes('-----BEGIN')?lit:(tryB64(raw)||lit);if(!out.endsWith('\n'))out+='\n';fs.writeFileSync(process.env.KEY_PATH,out);try{fs.chmodSync(process.env.KEY_PATH,0o600);}catch{};"
            echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          fi

      - name: Build universal DMG/ZIP with electron-builder
        working-directory: apps/client
        shell: bash
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          ENTITLEMENTS="$PWD/build/entitlements.mac.plist"
          if [[ ! -f "$ENTITLEMENTS" ]]; then
            echo "Entitlements file missing at $ENTITLEMENTS" >&2; exit 1
          fi
          bunx electron-vite build -c electron.vite.config.ts
          bunx electron-builder \
            --config electron-builder.json \
            --mac dmg zip \
            --universal \
            --publish never \
            --config.mac.forceCodeSigning=true \
            --config.mac.entitlements="$ENTITLEMENTS" \
            --config.mac.entitlementsInherit="$ENTITLEMENTS" \
            --config.mac.notarize=false

      - name: Notarize universal DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        working-directory: apps/client/dist-electron
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(./*.dmg)
          DMG=""
          if (( ${#dmg_files[@]} > 0 )); then
            DMG="${dmg_files[0]#./}"
          fi
          if [[ -z "$DMG" ]]; then
            echo "No DMG found in $(pwd)" >&2
            exit 1
          fi
          echo "Submitting $DMG for notarization..."
          if ! OUT=$(xcrun notarytool submit "$DMG" --wait --output-format json --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" 2>&1); then
            while IFS= read -r line; do
              printf 'notarytool: %s\n' "$line"
            done <<< "$OUT"
            echo "Notarization command failed" >&2
            exit 1
          fi
          while IFS= read -r line; do
            printf 'notarytool: %s\n' "$line"
          done <<< "$OUT"
          echo "$OUT" | grep -qi '"status" *: *"Accepted"\|status: Accepted\|Accepted' || { echo "Notarization failed"; exit 1; }

      - name: Staple and prepare update manifest
        working-directory: apps/client/dist-electron
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find . -maxdepth 2 -type d -name '*.app' | head -n1 || true)"
          shopt -s nullglob
          dmg_files=(./*.dmg)
          DMG=""
          if (( ${#dmg_files[@]} > 0 )); then
            DMG="${dmg_files[0]#./}"
          fi
          if [[ -n "$APP" ]]; then xcrun stapler staple "$APP" || true; fi
          if [[ -n "$DMG" ]]; then xcrun stapler staple "$DMG" || true; fi
          if [[ -f "latest-mac.yml" ]]; then
            rm -f latest-universal-mac.yml
            mv latest-mac.yml latest-universal-mac.yml
          fi

      - name: Publish notarized macOS universal artifacts to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          REPO: ${{ github.repository }}
        working-directory: apps/client/dist-electron
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=( *.dmg *.zip *.blockmap latest-*.yml )
          if [[ ${#artifacts[@]} -eq 0 ]]; then
            echo "No universal artifacts found to upload" >&2
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            if [[ "$artifact" == *.dmg ]]; then
              base="${artifact%.dmg}"
              renamed="${base}-universal.dmg"
              echo "Uploading $artifact as $renamed"
              gh release upload "$RELEASE_TAG" "$artifact#$renamed" --repo "$REPO" --clobber
            else
              echo "Uploading $artifact"
              gh release upload "$RELEASE_TAG" "$artifact" --repo "$REPO" --clobber
            fi
          done

  windows-x64:
    name: Windows x64
    needs: prepare-release
    if: >-
      github.ref_protected == true &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'manaflow-ai/manaflow/.github/workflows/release-pr.yml@refs/heads/main' &&
      startsWith(inputs.release_ref, 'release/v') &&
      inputs.release_sha != '' &&
      inputs.release_base_sha != '' &&
      inputs.caller_sha == github.sha
    environment: electron
    permissions:
      # Required to publish the Windows artifact to the GitHub release.
      contents: write # Upload the signed Windows artifact to the verified release.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted release ref
        env:
          TRUSTED_BASE_SHA: ${{ inputs.release_base_sha }}
          TRUSTED_CALLED_WORKFLOW_PATH: .github/workflows/release-updates.yml
          TRUSTED_CALLER_REF: ${{ github.ref }}
          TRUSTED_EVENT_REF: ${{ format('refs/heads/{0}', inputs.release_ref) }}
          TRUSTED_EVENT_REF_TYPE: branch
          TRUSTED_EVENT_SHA: ${{ inputs.release_sha }}
          TRUSTED_REF_KIND: release-branch
          TRUSTED_REF_PROTECTED: ${{ github.ref_protected }}
          TRUSTED_SOURCE_SHA: ${{ inputs.release_sha }}
          TRUSTED_WORKFLOW_SHA: ${{ inputs.caller_sha }}
          TRUSTED_WORKFLOW_PATH: .github/workflows/release-pr.yml
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRUSTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ && \
            "$TRUSTED_WORKFLOW_SHA" == "$GITHUB_SHA" ]] || {
            echo "Caller SHA does not match the protected workflow SHA" >&2
            exit 1
          }
          if ! git cat-file -e "$TRUSTED_WORKFLOW_SHA^{commit}" 2>/dev/null; then
            GIT_TERMINAL_PROMPT=0 git fetch --no-tags origin "$TRUSTED_WORKFLOW_SHA" >/dev/null 2>&1 || {
              echo "Unable to fetch the protected caller commit" >&2
              exit 1
            }
          fi
          trusted_gate="${RUNNER_TEMP:?}/verify-privileged-ref-${GITHUB_JOB}.sh"
          git show "$TRUSTED_WORKFLOW_SHA:.github/scripts/verify-privileged-ref.sh" > "$trusted_gate"
          chmod 700 "$trusted_gate"
          "$trusted_gate"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile
      - name: Write .env for build
        shell: bash
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_STACK_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_STACK_PROJECT_ID }}
          NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY }}
          NEXT_PUBLIC_WWW_ORIGIN: ${{ secrets.NEXT_PUBLIC_WWW_ORIGIN }}
          NEXT_PUBLIC_GITHUB_APP_SLUG: ${{ secrets.NEXT_PUBLIC_GITHUB_APP_SLUG }}
        run: |
          set -euo pipefail
          {
            printf 'NEXT_PUBLIC_CONVEX_URL=%s\n' "$NEXT_PUBLIC_CONVEX_URL"
            printf 'NEXT_PUBLIC_STACK_PROJECT_ID=%s\n' "$NEXT_PUBLIC_STACK_PROJECT_ID"
            printf 'NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY=%s\n' "$NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY"
            printf 'NEXT_PUBLIC_WWW_ORIGIN=%s\n' "$NEXT_PUBLIC_WWW_ORIGIN"
            printf 'NEXT_PUBLIC_GITHUB_APP_SLUG=%s\n' "$NEXT_PUBLIC_GITHUB_APP_SLUG"
          } > .env
      - name: Build native Rust addon
        working-directory: apps/server/native/core
        shell: pwsh
        run: |
          bunx --bun @napi-rs/cli build --platform --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate icons
        working-directory: apps/client
        run: bun run ./scripts/generate-icons.mjs
      - name: Build & publish Windows x64 to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_FLAG: ${{ github.event_name == 'release' && 'always' || 'never' }}
          RELEASE_OWNER: ${{ github.repository_owner }}
          RELEASE_REPOSITORY: ${{ github.event.repository.name }}
        working-directory: apps/client
        run: |
          bunx electron-vite build -c electron.vite.config.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bunx electron-builder --config electron-builder.json --win --x64 --publish always --config.publish.provider=github --config.publish.owner="$env:RELEASE_OWNER" --config.publish.repo="$env:RELEASE_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

